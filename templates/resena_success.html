<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reseña Enviada - Empresa Comercial</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    :root {
      --primary-color: #3498db;
      --secondary-color: #2c3e50;
      --accent-color: #e74c3c;
      --light-color: #ecf0f1;
      --success-color: #2ecc71;
    }

    body {
      line-height: 1.6;
      background-color: #f9f9f9;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .intro {
      max-width: 800px;
    }

    .success-message {
      background-color: var(--success-color);
      color: white;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
    }

    footer {
      margin-top: 50px;
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      padding: 20px;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>
<header class="p-4 mb-4">
  <div class="container">
    <h1>Reseña Enviada</h1>
    <p class="intro">La reseña ha sido enviada exitosamente.</p>
  </div>
</header>

<div class="container">
  <div class="card mb-4">
    <div class="card-body">
      <div class="success-message">¡Reseña enviada con éxito!</div>
      <p><strong>ID de la reseña:</strong> {{ reseña_id }}</p>
      <p><a href="/api/resenas" class="btn btn-primary">Ver reseñas destacadas</a></p>
    </div>
  </div>
</div>

<footer>
  <p>© 2025 API de Empresa Comercial - Todos los derechos reservados</p>
</footer>

<!-- Bootstrap JS and Popper.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
